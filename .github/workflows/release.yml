# Builds everything installable and, on a v* tag, attaches it to a GitHub Release.
#
# The Release is the contract: the launcher reads
# plugins-manifest.json from the newest release, and every jar, bootstrap and
# bundle it offers is an asset on that same release. A branch push builds the
# same artifacts and uploads them as workflow artifacts, so a break surfaces
# before a tag depends on it.
name: release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      is_release: ${{ steps.pick.outputs.is_release }}
    steps:
      # One place decides the version every other job stamps in, so a run can
      # never emit a launcher and an engine jar that disagree.
      - id: pick
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            short="$(echo "$GITHUB_SHA" | cut -c1-8)"
            version="0.0.0-dev.$GITHUB_RUN_NUMBER.$short"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved version: $version"

  engine-jar:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # re-resources is fetched separately below: it is a private repository,
          # so it needs its own key rather than the workflow token.
          submodules: false
      # A read-only deploy key scoped to reclass-data. Checkout's own ssh-key
      # input cannot be used, because it would clone this repository with the
      # same key and that key has no access here.
      - name: Fetch the RE resources submodule
        env:
          KEY: ${{ secrets.RECLASS_DATA_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "${KEY:-}" ]; then
            echo "RECLASS_DATA_DEPLOY_KEY is not set; the gameval guard will fail the build" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/reclass_data
          chmod 600 ~/.ssh/reclass_data
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/reclass_data -o IdentitiesOnly=yes"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule update --init --depth 1 re-resources
          test -n "$(find re-resources/gamevals -name '*.json' -print -quit)"
          echo "gamevals: $(find re-resources/gamevals -name '*.json' | wc -l) dictionaries"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships cmake, so the engine's native tasks would run here
      # and fail for want of SDL2. Exclude them: the bootstraps are built by
      # their own jobs, on runners that install the toolchain.
      - name: Build engine jar
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace -PprojectxVersion=${{ needs.version.outputs.version }}             :client-plugin-engine:shadowJar :client-plugin-engine:copySupervisorJar             -x :client-plugin-engine:configureNativeBootstrap             -x :client-plugin-engine:buildNativeBootstrap             -x :client-plugin-engine:copyNativeLibToBuild
      - name: Stage
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          mkdir -p dist
          cp client-plugin-engine/build/libs/*-all.jar "dist/projectx-engine-$v.jar"
          cp client-plugin-engine/build/libs/projectx-supervisor.jar "dist/projectx-supervisor-$v.jar"
          cd dist && sha256sum "projectx-engine-$v.jar" "projectx-supervisor-$v.jar" > "engine-$v.sha256"
      # Artifacts only carry files between jobs; the release keeps the real copies,
      # so a short retention keeps the account under its Actions storage quota.
      - uses: actions/upload-artifact@v4
        with:
          name: engine-jar
          path: dist/
          retention-days: 3

  # The engine's tests on both platforms players run, so a change made on one cannot break the other unnoticed.
  # Nothing is released or published to the launcher unless both pass.
  tests:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch the RE resources and native submodules
        env:
          KEY: ${{ secrets.RECLASS_DATA_DEPLOY_KEY }}
        run: |
          set -eu
          git submodule update --init --depth 1 client-plugin-engine/native-bootstrap/funchook client-plugin-engine/native-bootstrap/imgui
          if [ -z "${KEY:-}" ]; then
            echo "RECLASS_DATA_DEPLOY_KEY is not set; the gameval guard will fail the build" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/reclass_data
          chmod 600 ~/.ssh/reclass_data
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/reclass_data -o IdentitiesOnly=yes"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule update --init --depth 1 re-resources
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace -PprojectxVersion=${{ needs.version.outputs.version }} \
            :core:test :client-plugin-engine:test \
            -x :client-plugin-engine:configureNativeBootstrap \
            -x :client-plugin-engine:buildNativeBootstrap \
            -x :client-plugin-engine:copyNativeLibToBuild
      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            client-plugin-engine/build/reports/tests/
            core/build/reports/tests/
          retention-days: 7

  bootstrap-linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch the native submodules
        run: git submodule update --init --depth 1 client-plugin-engine/native-bootstrap/funchook client-plugin-engine/native-bootstrap/imgui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install toolchain
        run: |
          sh .github/ci/apt-install.sh cmake clang lld make libsdl2-dev libopengl-dev libegl-dev
      - name: Build
        run: |
          set -eu
          cd client-plugin-engine/native-bootstrap
          cmake --preset linux-clang
          cmake --build --preset linux-clang
      - name: Stage
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          mkdir -p dist
          cp client-plugin-engine/native-bootstrap/build/libprojectxbootstrap.so "dist/libprojectxbootstrap-$v.so"
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-linux
          path: dist/
          retention-days: 3

  bootstrap-windows:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch the native submodules
        run: git submodule update --init --depth 1 client-plugin-engine/native-bootstrap/funchook client-plugin-engine/native-bootstrap/imgui
      - name: Install toolchain
        run: |
          sh .github/ci/apt-install.sh cmake g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 make curl unzip
      # A Windows JDK, not the host one: find_package(JNI) would otherwise resolve
      # a jni_md.h that defines jint/jlong for LP64 rather than the LLP64 the DLL
      # needs. Headers only; the JVM is loaded at runtime via LoadLibraryW.
      - name: Fetch Windows JNI headers
        id: jni
        run: |
          set -eu
          curl -fsSL -o winjdk.zip "https://api.adoptium.net/v3/binary/latest/25/ga/windows/x64/jdk/hotspot/normal/eclipse?project=jdk"
          mkdir -p winjdk
          unzip -q winjdk.zip -d winjdk
          inc="$(find "$PWD/winjdk" -maxdepth 3 -type d -name include | head -1)"
          test -f "$inc/jni.h"
          echo "include=$inc" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          set -eu
          cd client-plugin-engine/native-bootstrap
          cmake --preset windows-mingw -DJNI_INCLUDE_DIRS="${{ steps.jni.outputs.include }};${{ steps.jni.outputs.include }}/win32"
          cmake --build --preset windows-mingw
      # The DLL is injected into a client that knows nothing about MinGW, so a
      # lost static-runtime option must fail here rather than at LoadLibraryW.
      - name: Verify no MinGW runtime dependency
        run: |
          set -eu
          dll=client-plugin-engine/native-bootstrap/build-windows-mingw/projectxbootstrap.dll
          if x86_64-w64-mingw32-objdump -p "$dll" | grep -E 'libgcc_s_seh-1|libstdc\+\+-6|libwinpthread-1'; then
            echo "static-runtime link options were lost" >&2
            exit 1
          fi
      - name: Stage
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          mkdir -p dist
          cp client-plugin-engine/native-bootstrap/build-windows-mingw/projectxbootstrap.dll "dist/projectxbootstrap-$v.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-windows
          path: dist/
          retention-days: 3

  # Loads each freshly built bootstrap into a throwaway process the way the launcher injects it, and
  # requires Java to start and hand over to the supervisor, on the oldest and newest JDK the engine
  # supports. Nothing is released or published to the launcher unless every combination passes.
  bootstrap-smoke:
    needs: [version, engine-jar, bootstrap-linux, bootstrap-windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
        java: ["25", "27"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "{engine-jar,bootstrap-linux,bootstrap-windows}"
          path: incoming
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sh .github/ci/apt-install.sh libsdl2-2.0-0 libegl1 libopengl0
      - name: Load the bootstrap
        shell: bash
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          if [ '${{ runner.os }}' = Windows ]; then
            lib="incoming/bootstrap-windows/projectxbootstrap-$v.dll"
          else
            lib="incoming/bootstrap-linux/libprojectxbootstrap-$v.so"
          fi
          py="$(command -v python3 || command -v python)"
          "$py" .github/ci/bootstrap-smoke.py "$lib" "incoming/engine-jar/projectx-supervisor-$v.jar"

  # The route planner the launcher runs on localhost, built from the vendored source (used with its author's
  # permission; only the binaries ship). x86-64-v3 by default, plus baseline copies for CPUs without AVX2.
  navpath:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: navpath
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: navpath
          key: ${{ hashFiles('navpath/Cargo.lock') }}
      - name: Build
        shell: bash
        working-directory: navpath
        run: |
          set -eu
          cargo build --release --locked -p navpath-service -p navpath-builder
          RUSTFLAGS="-C target-cpu=x86-64" cargo build --release --locked -p navpath-service -p navpath-builder \
            --features navpath-core/allow-baseline-cpu --target-dir target/baseline
      - name: Stage
        shell: bash
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          n='${{ matrix.name }}'
          x=''
          case "$n" in windows-*) x='.exe' ;; esac
          mkdir -p stage dist
          for bin in navpath-service navpath-builder; do
            cp "navpath/target/release/$bin$x" "stage/$bin$x"
            cp "navpath/target/baseline/release/$bin$x" "stage/$bin-baseline$x"
          done
          case "$n" in
            windows-*) (cd stage && 7z a -tzip "../dist/navpath-$v-$n.zip" *) ;;
            *)         (cd stage && tar -czf "../dist/navpath-$v-$n.tar.gz" *) ;;
          esac
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: navpath-${{ matrix.name }}
          path: dist/
          retention-days: 3

  # Upstream's map at the commit navpath/UPSTREAM pins, with links.json merged in. Platform-independent, so built once.
  navpath-map:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            .github
            navpath
            client-plugin-engine/src/main/resources/webwalker
      - name: Test the merge
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      # Upstream knows a few hundred doors; the game's other doors and the rooms behind them go in first, then our links.
      - name: Add doors, then merge links.json
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          mkdir -p dist work
          python3 .github/scripts/navpath_doors.py --db navpath/worldReachableTiles.db \
            --doors navpath/doors/navpath-doors.tsv --tiles navpath/doors/navpath-tiles.tsv --out work/doors.db
          python3 .github/scripts/navpath_map.py work/doors.db \
            client-plugin-engine/src/main/resources/webwalker/links.json "dist/navpath-map-$v.db"
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: navpath-map
          path: dist/
          retention-days: 3

  # The shipped archive and map, run the way the launcher runs them: a snapshot built with each builder, its service
  # started, /health answered and a route planned. Gates the release and the launcher publish like bootstrap-smoke.
  navpath-smoke:
    needs: [version, navpath, navpath-map]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x86_64
          - runner: windows-latest
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          pattern: "{navpath-${{ matrix.name }},navpath-map}"
          path: incoming
      - name: Build a snapshot, serve and route
        shell: bash
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          n='${{ matrix.name }}'
          mkdir -p navpath
          case "$n" in
            windows-*) 7z x -onavpath "incoming/navpath-$n/navpath-$v-$n.zip" ;;
            *)         tar -xzf "incoming/navpath-$n/navpath-$v-$n.tar.gz" -C navpath ;;
          esac
          ls -la navpath
          py="$(command -v python3 || command -v python)"
          "$py" .github/ci/navpath-smoke.py navpath "incoming/navpath-map/navpath-map-$v.db"

  launcher:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            archive: targz
          - name: windows-x86_64
            runner: windows-latest
            archive: exe
          - name: macos-universal
            runner: macos-latest
            archive: bare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/launcher
      - name: Linux webview deps
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sh .github/ci/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # A launch needs the patcher and injection needs the injectors. They are built first: the Windows launcher
      # carries them inside its exe, so its release is one file; elsewhere they ship beside it in the bundle.
      - name: Build the patcher and injectors
        shell: bash
        run: |
          set -eu
          case '${{ matrix.name }}' in
            windows-*) cargo build --release --manifest-path client/launcher/patcher-win/Cargo.toml ;;
            linux-*)   cargo build --release --manifest-path client/launcher/patcher/Cargo.toml ;;
            macos-*)   cargo build --release --manifest-path client/launcher/patcher-mac/Cargo.toml ;;
          esac
      - name: Build the launcher
        shell: bash
        env:
          PROJECTX_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          case '${{ matrix.name }}' in
            windows-*) export PROJECTX_EMBED_DIR="$PWD/client/launcher/patcher-win/target/release" ;;
          esac
          cargo build --release --manifest-path client/launcher/Cargo.toml --bin project-x-launcher
      - name: Stage
        shell: bash
        run: |
          set -eu
          mkdir -p stage
          case '${{ matrix.name }}' in
            windows-*)
              cp client/launcher/target/release/project-x-launcher.exe stage/
              ;;
            linux-*)
              cp client/launcher/target/release/project-x-launcher stage/
              cp client/launcher/patcher/target/release/libprojectx_patcher.so stage/
              ;;
            macos-*)
              cp client/launcher/target/release/project-x-launcher stage/
              cp client/launcher/patcher-mac/target/release/libprojectx_patcher.dylib stage/
              ;;
          esac
          ls -la stage/
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: stage/
          retention-days: 3

  # Per-platform downloads. The Windows launcher is a single exe with the patcher
  # and injectors inside it; it downloads the engine, bootstrap and supervisor
  # into its data dir on first use, like every platform does the engine jar.
  # Linux ships a folder:
  #
  #   project-x-launcher, libprojectx_patcher.so
  #   engine/  bootstrap + supervisor, the seed for PROJECTX_HOME_DIR
  bundle:
    needs: [version, launcher, engine-jar, bootstrap-linux, bootstrap-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            bootstrap: bootstrap-linux
            archive: targz
          - name: windows-x86_64
            bootstrap: bootstrap-windows
            archive: exe
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{launcher-${{ matrix.name }},${{ matrix.bootstrap }},engine-jar}"
          path: incoming
      - name: Assemble
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          n='${{ matrix.name }}'
          dir="project-x-launcher-$n-$v"
          mkdir -p dist
          if [ '${{ matrix.archive }}' = exe ]; then
            cp "incoming/launcher-$n/project-x-launcher.exe" "dist/$dir.exe"
            cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
            ls -la
            exit 0
          fi
          mkdir -p "$dir/engine"

          cp incoming/launcher-$n/* "$dir/"
          # The bootstrap ships versioned as its own release asset; inside the
          # bundle it takes the fixed name the injector resolves by.
          for f in incoming/${{ matrix.bootstrap }}/*; do
            case "$f" in
              *.so)  cp "$f" "$dir/engine/libprojectxbootstrap.so" ;;
              *.dll) cp "$f" "$dir/engine/projectxbootstrap.dll" ;;
            esac
          done
          cp incoming/engine-jar/projectx-supervisor-*.jar "$dir/engine/projectx-supervisor.jar"

          chmod +x "$dir/project-x-launcher" 2>/dev/null || true
          find "$dir" -type f | sort

          case '${{ matrix.archive }}' in
            zip)   zip -qr "dist/$dir.zip" "$dir" ;;
            targz) tar -czf "dist/$dir.tar.gz" "$dir" ;;
          esac
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: dist/
          retention-days: 3

  release:
    needs: [version, engine-jar, tests, bootstrap-linux, bootstrap-windows, bootstrap-smoke, launcher, bundle, navpath, navpath-map, navpath-smoke]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      # Every job staged into its own dist/, so flatten them into the one set the
      # manifest describes and the release carries.
      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          find incoming -type f -exec cp -n {} dist/ \;
          ls -la dist/
      - name: Build manifest
        env:
          PROJECTX_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          sh .github/ci/apt-install.sh jq
          chmod +x .github/ci/build-manifest.sh
          ./.github/ci/build-manifest.sh dist plugins-manifest.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Project X ${{ needs.version.outputs.version }}
          body: |
            Launcher bundles and the Project X engine for ${{ needs.version.outputs.version }}.

            The launcher installs the engine from this release itself, verified
            against plugins-manifest.json. Scripts ship through the RS3 store.
          files: |
            dist/*
            plugins-manifest.json

  # Highlights and script API changes, posted to Discord. Its own workflow so a
  # release can be announced again by hand; see announce-api.yml.
  announce-api:
    needs: [version, release]
    if: needs.version.outputs.is_release == 'true'
    uses: ./.github/workflows/announce-api.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # Launcher downloads have to be publicly reachable, and release assets on a
  # private repository are not. So the bundles are published to a public
  # distribution repository that holds no source, giving users permanent
  # `releases/latest/download/...` links.
  publish-launcher:
    needs: [version, bundle, engine-jar, tests, bootstrap-linux, bootstrap-windows, bootstrap-smoke, navpath, navpath-map, navpath-smoke]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          find incoming -type f -exec cp -n {} dist/ \;
          ls -la dist/
      # A versioned filename makes releases/latest/download/<name> break on every
      # release, so publish an unversioned copy of each archive alongside it. The
      # engine release keeps the versioned names, which the manifest reads.
      - name: Add unversioned copies for permanent links
        run: |
          set -eu
          v='${{ needs.version.outputs.version }}'
          cd dist
          for f in *; do
            case "$f" in *.sha256) continue;; esac
            stable="$(echo "$f" | sed "s/-$v//")"
            [ "$stable" = "$f" ] && continue
            cp "$f" "$stable"
            sha256sum "$stable" > "$stable.sha256"
          done
          ls -la
      # The manifest the launcher reads must live beside the assets it names, and
      # its URLs must point at this public repository rather than the private one.
      - name: Build the manifest for the public assets
        env:
          PROJECTX_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          ASSET_REPO: iEasyScript/launcher
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          sh .github/ci/apt-install.sh jq
          chmod +x .github/ci/build-manifest.sh
          ./.github/ci/build-manifest.sh dist plugins-manifest.json
          cp plugins-manifest.json dist/
      - name: Publish to the public launcher repository
        env:
          # A PAT with contents:write on iEasyScript/launcher. The default token
          # cannot write to another repository.
          GH_TOKEN: ${{ secrets.LAUNCHER_RELEASE_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "LAUNCHER_RELEASE_TOKEN is not set; skipping public publish" >&2
            exit 1
          fi
          gh release create "$TAG" -R iEasyScript/launcher             --title "Project X Launcher $VERSION"             --notes "Launcher builds for Windows and Linux. The launcher installs the engine and scripts itself."             dist/* || gh release upload "$TAG" -R iEasyScript/launcher dist/* --clobber
